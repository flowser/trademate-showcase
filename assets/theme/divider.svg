<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="28" viewBox="0 0 1200 28" role="img" aria-label="Section divider"><title>Section divider</title>
<style>
  .f { animation: rise .8s cubic-bezier(.2,.7,.2,1) both; }
  .d1 { animation-delay: .05s } .d2 { animation-delay: .15s } .d3 { animation-delay: .25s }
  .d4 { animation-delay: .35s } .d5 { animation-delay: .45s } .d6 { animation-delay: .55s }
  .cur { animation: blink 1.1s steps(1) infinite; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes blink { 50% { opacity: 0; } }
</style><defs><linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#4f46e5" stop-opacity="0"/><stop offset="0.3" stop-color="#4f46e5"/>
<stop offset="0.7" stop-color="#0ea5e9"/><stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/></linearGradient></defs>
<rect x="0" y="13" width="1200" height="2" fill="url(#line)"/>
<circle cx="600.0" cy="14" r="5" fill="#f97316"/></svg>
