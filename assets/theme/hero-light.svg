    <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.14"/><stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
  </radialGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
