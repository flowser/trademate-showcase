<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="TradeMate — Risk-first MT5 trading system."><title>TradeMate — Risk-first MT5 trading system.</title>
<style>
  .f { animation: rise .8s cubic-bezier(.2,.7,.2,1) both; }
